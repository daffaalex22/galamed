# Galamed CMS: diedit via https://galamed.vercel.app/admin
# Login = akun GitHub (butuh akses Write ke repo, lihat CMS_GUIDE.md).
# local_backend dipakai saat development lokal (jalankan `npm run cms`).

local_backend: true

backend:
  name: github
  repo: daffaalex22/galamed
  branch: main
  # OAuth proxy hidup di domain production yang sama (api/auth + api/callback).
  base_url: https://galamed.vercel.app
  auth_endpoint: api/auth

# Foto produk yang diupload masuk ke public/images/products.
media_folder: public/images/products
public_folder: /images/products

collections:
  - name: products
    label: Produk
    label_singular: Produk
    folder: src/content/products
    create: true
    # Nama file = slug. JANGAN rename file produk yang sudah ada.
    slug: '{{slug}}'
    identifier_field: name
    summary: '{{fields.name}} ({{fields.category}})'
    editor:
      preview: false
    fields:
      - { label: 'Nama Produk', name: name, widget: string, hint: 'cth: Sterile Gauze (Kasa Steril)' }
      - { label: 'Ringkasan singkat', name: short, widget: string, hint: '1 kalimat: bentuk + ukuran. Dipakai sebagai subjudul & deskripsi meta halaman produk.' }
      - { label: 'Deskripsi kartu', name: desc, widget: text, hint: '1-2 kalimat untuk kartu produk di beranda: bentuk, ukuran, kemasan, pemakaian' }
      - { label: 'Kategori', name: category, widget: select, options: ['Kasa & Kapas', 'Perawatan Luka', 'Antiseptik'] }
      - { label: 'Ukuran standar (opsional)', name: ukuran, widget: string, required: false, hint: 'cth: 5x5 cm (standar). Kosongkan bila tidak ada ukuran standar. Dipakai di data terstruktur Product.' }
      - { label: 'Terakhir diperbarui', name: updated, widget: datetime, format: 'YYYY-MM-DD', required: false, hint: 'Ubah setiap kali isi halaman produk direvisi. Tampil sebagai "Terakhir diperbarui" dan dipakai di data terstruktur Product.' }
      - { label: 'Foto Produk', name: image, widget: image, hint: 'Otomatis tersimpan di /images/products. JPG/PNG/WebP. Dikompres otomatis saat build.' }
      - label: 'Isi halaman produk'
        name: body
        widget: markdown
        hint: 'Konten panjang halaman /produk/…. Gunakan Heading 2 (H2) untuk judul bagian. Akhiri dengan kalimat ukuran & kemasan custom. Konten baru tampil di situs setelah build selesai.'

  - name: settings
    label: Pengaturan Situs
    files:
      - name: site
        label: Kontak & Info
        file: src/data/site.json
        editor:
          preview: false
        fields:
          - { label: 'Nama Perusahaan', name: company, widget: string }
          - { label: 'Nama Brand', name: brand, widget: string }
          - { label: 'Tagline', name: tagline, widget: string }
          - { label: 'Email', name: email, widget: string, hint: 'cth: refa@galamed.id' }
          - { label: 'No. WA Tampil', name: phoneDisplay, widget: string, hint: 'cth: +62 823-1582-2926' }
          - { label: 'No. WA Sistem', name: waNumber, widget: string, hint: 'PENTING: angka saja diawali 62, tanpa +, spasi, strip. cth: 6282315822926' }
          - { label: 'Alamat', name: address, widget: text, required: false, hint: 'Alamat kantor/warehouse, tampil di footer. Kosongkan jika belum siap.' }
          - { label: 'Jam Layanan', name: hours, widget: string, required: false, hint: 'cth: Senin-Jumat 08:00-17:00 WIB' }
