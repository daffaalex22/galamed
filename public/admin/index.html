<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Galamed CMS</title>
  </head>
  <body>
    <script>
      // Decap resolves config.yml relative to the page URL, so /admin
      // (no trailing slash) would wrongly fetch /config.yml → 404.
      // Normalize to /admin/ before the CMS boots.
      if (!window.location.pathname.endsWith('/')) {
        window.location.replace(
          window.location.pathname + '/' + window.location.search + window.location.hash
        );
      }
    </script>
    <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
  </body>
</html>
